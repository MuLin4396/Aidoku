name: Build and upload nightly ipa

on:
  push:
  workflow_dispatch:

# xcode-27-arm64/20260928.0222 is macOS 27.0. Package with the iOS 27.1 SDK
# (24A94401), which ships in Xcode 27.1 rather than the default Xcode 27.0 or 27.2 beta.
env:
  BUILD_ENV_LABEL: Xcode 27.1 / iOS 27.1 (24A94401) / macOS 27.0

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta:
    name: Build metadata
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      date: ${{ steps.meta.outputs.date }}
      commit_msg: ${{ steps.meta.outputs.commit_msg }}
      commit_author: ${{ steps.meta.outputs.commit_author }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Get build metadata
        id: meta
        run: |
          set -euo pipefail
          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +'%Y%m%d_%H%M%S')"
            echo "commit_msg<<GHA_EOF"
            git log -1 --pretty=format:'%s'
            echo
            echo "GHA_EOF"
            echo "commit_author<<GHA_EOF"
            git log -1 --pretty=format:'%an'
            echo
            echo "GHA_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Archive (${{ matrix.kind }})
    needs: meta
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: simulator
            sdk: iphonesimulator27.1
            destination: generic/platform=iOS Simulator
          - kind: device
            sdk: iphoneos27.1
            destination: generic/platform=iOS
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      KIND: ${{ matrix.kind }}
      SDK: ${{ matrix.sdk }}
      DESTINATION: ${{ matrix.destination }}
      BUILD_DATE: ${{ needs.meta.outputs.date }}
      SHA_SHORT: ${{ needs.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify iOS 27.1 SDK
        run: |
          set -euo pipefail
          info="$(xcodebuild -version)"
          printf '%s\n' "$info"
          sw_vers
          xcode_version="$(printf '%s\n' "$info" | awk 'NR==1 { print $2 }')"
          sdk_version="$(xcrun --sdk "$SDK" --show-sdk-version)"
          sdk_build="$(xcrun --sdk "$SDK" --show-sdk-build-version)"
          printf 'SDK %s version %s build %s\n' "$SDK" "$sdk_version" "$sdk_build"
          case "$xcode_version" in
            27.1*) ;;
            *)
              echo "Expected Xcode 27.1, got ${xcode_version:-unknown}" >&2
              exit 1
              ;;
          esac
          if [ "$sdk_version" != "27.1" ] || [ "$sdk_build" != "24A94401" ]; then
            echo "Expected iOS 27.1 (24A94401), got ${sdk_version:-unknown} (${sdk_build:-unknown})" >&2
            exit 1
          fi

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild -scheme "Aidoku" \
            -configuration Release \
            -sdk "$SDK" \
            -destination "$DESTINATION" \
            archive -archivePath "$RUNNER_TEMP/Aidoku.xcarchive" \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          IPA_NAME="Aidoku_nightly_${KIND}_${BUILD_DATE}_${SHA_SHORT}.ipa"
          STAGE="$RUNNER_TEMP/ipa"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$RUNNER_TEMP/Aidoku.xcarchive/Products/Applications/Aidoku.app" "$STAGE/Payload/"
          # -y stores symlinks as links so Frameworks inside the .app stay intact.
          (cd "$STAGE" && zip -ry "$GITHUB_WORKSPACE/$IPA_NAME" Payload)
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ matrix.kind }}
          path: ${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      dev_name: ${{ steps.release.outputs.dev_name }}
      dev_size: ${{ steps.release.outputs.dev_size }}
      dev_download_url: ${{ steps.release.outputs.dev_download_url }}
      sim_name: ${{ steps.release.outputs.sim_name }}
      sim_size: ${{ steps.release.outputs.sim_size }}
      sim_download_url: ${{ steps.release.outputs.sim_download_url }}
    steps:
      - name: Download IPAs
        uses: actions/download-artifact@v4
        with:
          pattern: ipa-*
          merge-multiple: true
          path: dist

      - name: Publish to GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: nightly-${{ needs.meta.outputs.date }}-${{ needs.meta.outputs.sha_short }}
          COMMIT_MSG: ${{ needs.meta.outputs.commit_msg }}
          BUILD_DATE: ${{ needs.meta.outputs.date }}
          SHA_SHORT: ${{ needs.meta.outputs.sha_short }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dev=(dist/Aidoku_nightly_device_*.ipa)
          sim=(dist/Aidoku_nightly_simulator_*.ipa)
          if [ "${#dev[@]}" -ne 1 ] || [ "${#sim[@]}" -ne 1 ]; then
            echo "Expected exactly one device IPA and one simulator IPA" >&2
            ls -la dist >&2
            exit 1
          fi

          DEV_NAME="$(basename "${dev[0]}")"
          SIM_NAME="$(basename "${sim[0]}")"
          DEV_SIZE="$(du -h "${dev[0]}" | cut -f1)"
          SIM_SIZE="$(du -h "${sim[0]}" | cut -f1)"

          NOTES="$(printf 'Commit: %s (%s)\n' "$COMMIT_MSG" "$GITHUB_SHA")"
          gh release create "$TAG_NAME" \
            "${dev[0]}" \
            "${sim[0]}" \
            --title "Nightly Build - ${BUILD_DATE} (${SHA_SHORT})" \
            --notes "$NOTES" \
            --prerelease

          BASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          {
            echo "dev_name=$DEV_NAME"
            echo "dev_size=$DEV_SIZE"
            echo "dev_download_url=${BASE_URL}/${DEV_NAME}"
            echo "sim_name=$SIM_NAME"
            echo "sim_size=$SIM_SIZE"
            echo "sim_download_url=${BASE_URL}/${SIM_NAME}"
          } >> "$GITHUB_OUTPUT"

  notify:
    name: Send Feishu notification
    needs: [meta, build, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Feishu Notification
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHA: ${{ needs.meta.outputs.sha_short || github.sha }}
          MSG: ${{ needs.meta.outputs.commit_msg }}
          AUTHOR: ${{ needs.meta.outputs.commit_author }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          ENV_LABEL: ${{ env.BUILD_ENV_LABEL }}
          DEV_NAME: ${{ needs.publish.outputs.dev_name }}
          DEV_SIZE: ${{ needs.publish.outputs.dev_size }}
          DEV_URL: ${{ needs.publish.outputs.dev_download_url }}
          SIM_NAME: ${{ needs.publish.outputs.sim_name }}
          SIM_SIZE: ${{ needs.publish.outputs.sim_size }}
          SIM_URL: ${{ needs.publish.outputs.sim_download_url }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_URL is not set; skipping Feishu notification." >&2
            exit 1
          fi

          if [ "$BUILD_RESULT" = "success" ] && [ "$PUBLISH_RESULT" = "success" ]; then
            STATUS="success"
          elif [ "$BUILD_RESULT" = "cancelled" ] || [ "$PUBLISH_RESULT" = "cancelled" ]; then
            STATUS="cancelled"
          else
            STATUS="failure"
          fi

          if [ "$STATUS" = "success" ]; then
            CARD_COLOR="green"
            STATUS_TITLE="✅ iOS Nightly IPA 打包成功"
          elif [ "$STATUS" = "cancelled" ]; then
            CARD_COLOR="orange"
            STATUS_TITLE="⚠️ iOS Nightly IPA 打包已取消"
          else
            CARD_COLOR="red"
            STATUS_TITLE="❌ iOS Nightly IPA 打包失败"
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TRIGGER_TXT="手动触发 ($ACTOR)"
          else
            TRIGGER_TXT="Push 事件 ($ACTOR)"
          fi

          if [ "$STATUS" = "success" ]; then
            ARTIFACTS_MD=$(printf '**📦 独立构建产物:**\n• 📱 **Device 真机包**: `%s` (**%s**)\n• 💻 **Simulator 模拟器包**: `%s` (**%s**)' \
              "$DEV_NAME" "$DEV_SIZE" "$SIM_NAME" "$SIM_SIZE")
            ACTION_BUTTONS=$(jq -n \
              --arg dev "$DEV_URL" \
              --arg sim "$SIM_URL" \
              --arg commit "$COMMIT_URL" \
              '[
                {"tag":"button","text":{"tag":"plain_text","content":"📱 下载 Device IPA"},"type":"primary","url":$dev},
                {"tag":"button","text":{"tag":"plain_text","content":"💻 下载 Simulator IPA"},"type":"primary","url":$sim},
                {"tag":"button","text":{"tag":"plain_text","content":"🔍 查看 Commit"},"type":"default","url":$commit}
              ]')
          else
            ARTIFACTS_MD="**⚠️ 未生成产物**，请前往 Run 日志排查编译错误。"
            ACTION_BUTTONS=$(jq -n --arg run "$RUN_URL" \
              '[{"tag":"button","text":{"tag":"plain_text","content":"📋 查看构建日志"},"type":"danger","url":$run}]')
          fi

          jq -n \
            --arg title "$STATUS_TITLE" \
            --arg color "$CARD_COLOR" \
            --arg branch "$BRANCH" \
            --arg trigger "$TRIGGER_TXT" \
            --arg sha "$SHA" \
            --arg commit_url "$COMMIT_URL" \
            --arg env_label "$ENV_LABEL" \
            --arg msg "$MSG" \
            --arg author "$AUTHOR" \
            --arg artifacts "$ARTIFACTS_MD" \
            --argjson buttons "$ACTION_BUTTONS" \
            '{
              msg_type: "interactive",
              card: {
                config: { wide_screen_mode: true },
                header: {
                  title: { tag: "plain_text", content: $title },
                  template: $color
                },
                elements: [
                  {
                    tag: "div",
                    fields: [
                      {is_short: true, text: {tag: "lark_md", content: ("**🌿 分支:**\n`" + $branch + "`")}},
                      {is_short: true, text: {tag: "lark_md", content: ("**👤 触发者 / 方式:**\n" + $trigger)}},
                      {is_short: true, text: {tag: "lark_md", content: ("**🔨 提交 Hash:**\n[" + $sha + "](" + $commit_url + ")")}},
                      {is_short: true, text: {tag: "lark_md", content: ("**⚙️ 编译环境:**\n" + $env_label)}}
                    ]
                  },
                  {tag: "div", text: {tag: "lark_md", content: ("**💬 提交信息:**\n> " + $msg + " *(by " + $author + ")*")}},
                  {tag: "hr"},
                  {tag: "div", text: {tag: "lark_md", content: $artifacts}},
                  {tag: "action", actions: $buttons}
                ]
              }
            }' \
          | curl -sS -f -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @-
